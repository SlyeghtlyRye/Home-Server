<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <style>
    :root {
      --color-bg: #1a1a1a;
      --color-surface: #2d2d2d;
      --color-accent: #64b5f6;
      --color-text-muted: #888;
      --color-text-dim: #bbb;
      --color-border: #555;
      --color-border-soft: #444;
      --color-warning: #ffd479;
      --color-warning-border: #b8860b;
      --color-warning-bg: #3a2f1a;
      --color-danger-border: #c0392b;
      --color-danger-bg: #3a2323;
      --color-selected-bg: #2f4a63;
      --radius-md: 8px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --space-sm: 10px;
      --space-md: 15px;
      --space-lg: 20px;
    }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: var(--color-bg); color: white; margin: 0; padding: 15px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; font-size: 32px; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: var(--color-surface); padding: 25px; border-radius: 8px; text-align: center; cursor: pointer; transition: transform 0.2s; border: 2px solid transparent; }
    .card:hover { transform: scale(1.05); border-color: var(--color-accent); }
    .card h2 { margin-top: 0; font-size: 24px; margin-bottom: 10px; }
    .card p { margin: 0; font-size: 16px; color: var(--color-text-dim); }
    #detail-view { display: none; }
    .back-btn { background: var(--color-surface); color: white; border: 1px solid var(--color-border); padding: 10px 18px; border-radius: 6px; cursor: pointer; margin: 20px 0; font-size: 15px; }
    .back-btn:hover { border-color: var(--color-accent); }
    .goto-btn { display: inline-block; background: var(--color-accent); color: var(--color-bg); font-weight: bold; padding: 12px 20px; border-radius: 6px; text-decoration: none; margin-top: 15px; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
    .btn { background: var(--color-surface); color: white; border: 2px solid transparent; padding: 14px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn:hover { border-color: var(--color-accent); }
    .btn.clear { background: var(--color-danger-bg); }
    .btn.small { padding: 8px 14px; font-size: 13px; }
    .icon-btn-delete {
      background: var(--color-danger-bg);
      color: #ff9d9d;
      border: 1px solid var(--color-danger-border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }
    .icon-btn-delete:hover { background: #4a2b2b; }
    .icon-btn-erase {
      background: var(--color-warning-bg);
      color: var(--color-warning);
      border: 1px solid var(--color-warning-border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }
    .icon-btn-erase:hover { background: #4a3c22; }
    .week-block { background: var(--color-surface); border-radius: 8px; padding: 15px 20px; margin: 15px 0; position: relative; }
    .week-block h3 { margin-top: 0; }
    .shopping-items { list-style: none; padding: 0; margin: 0; }
    .shopping-items li { padding: 6px 0; border-bottom: 1px solid var(--color-border-soft); display: flex; align-items: center; gap: 10px; }
    .shopping-items li:last-child { border-bottom: none; }
    .warning-box { background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 14px; color: var(--color-warning); }
    .error-banner { background: var(--color-danger-bg); border: 1px solid var(--color-danger-border); border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 14px; color: #ff9d9d; display: none; }

    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .cal-header-left { display: flex; align-items: center; gap: 10px; }
    .cal-header h3 { margin: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-weekday { text-align: center; color: var(--color-text-muted); font-size: 12px; padding: 4px 0; }
    .cal-day { background: var(--color-surface); border-radius: 6px; padding: 6px; min-height: 64px; cursor: pointer; border: 2px solid transparent; font-size: 12px; position: relative; overflow: hidden; }
    .cal-day:hover { border-color: var(--color-border); }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { box-shadow: inset 0 0 0 2px #ffb74d; }
    .cal-day.planned { background: #233b2d; }
    .cal-day.included { border-color: var(--color-accent) !important; background: var(--color-selected-bg); }
    .cal-day.excluded { border-color: #a55; opacity: 0.5; text-decoration: line-through; }
    .cal-daynum { font-weight: bold; }
    .cal-meal { font-size: 10px; color: var(--color-text-dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-loading { text-align: center; padding: 40px 0; color: var(--color-text-muted); }
    .cal-day.view-selected, .cal-day.edit-selected { border-color: var(--color-accent) !important; background: var(--color-selected-bg); }

    .mode-toggle { display: inline-flex; gap: 4px; background: var(--color-bg); border: 1px solid var(--color-border-soft); border-radius: 6px; padding: 3px; }
    .mode-toggle button { background: transparent; border: none; color: var(--color-text-dim); padding: 6px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .mode-toggle button.active { background: var(--color-selected-bg); color: white; }
    .mode-toggle button:hover:not(.active) { color: white; }

    .meal-of-day { background: var(--color-surface); border-radius: 8px; padding: 18px 20px; margin: 15px 0; }
    .meal-of-day h3 { margin: 0 0 6px; font-size: 13px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; }
    .meal-of-day .meal-name { font-size: 22px; font-weight: bold; margin: 4px 0 8px; }
    .meal-empty { color: var(--color-text-muted); font-size: 14px; font-style: italic; }
    .meal-link { color: var(--color-accent); font-size: 14px; cursor: pointer; }
    .meal-link:hover { text-decoration: underline; }

    #mode-panel {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 32px));
      z-index: 200;
    }
    #mode-panel.show { display: block; }
    .mode-panel-inner {
      position: relative;
      background: var(--color-surface);
      border: 1px solid var(--color-border-soft);
      border-radius: 10px;
      padding: 16px 24px 42px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      min-height: 160px;
      max-height: 70vh;
    }
    .mode-panel-body {
      overflow-y: auto;
      margin-top: 10px;
      flex: 1 1 auto;
      min-height: 0;
      padding-right: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-soft) transparent;
    }
    .mode-panel-body::-webkit-scrollbar { width: 6px; }
    .mode-panel-body::-webkit-scrollbar-track { background: transparent; }
    .mode-panel-body::-webkit-scrollbar-thumb { background: var(--color-border-soft); border-radius: 3px; }
    .mode-panel-body::-webkit-scrollbar-thumb:hover { background: var(--color-border); }
    .mode-panel-body .vd-date { color: var(--color-text-muted); font-size: 13px; }
    .mode-panel-body .vd-meal { font-size: 16px; font-weight: bold; margin: 4px 0 8px; }
    .mode-panel-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: bold; letter-spacing: .5px; text-transform: uppercase;
      padding: 3px 10px 3px 8px; border-radius: 999px;
      cursor: pointer;
      background: var(--color-bg); border: 1px solid var(--color-border-soft);
    }
    .mode-panel-badge .mode-panel-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .mode-panel-badge.mode-plan { color: var(--color-accent); border-color: var(--color-accent); }
    .mode-panel-badge.mode-plan .mode-panel-dot { background: var(--color-accent); }
    .mode-panel-badge.mode-view { color: #7cb87c; border-color: #7cb87c; }
    .mode-panel-badge.mode-view .mode-panel-dot { background: #7cb87c; }
    .mode-panel-badge.mode-edit { color: var(--color-warning); border-color: var(--color-warning-border); }
    .mode-panel-badge.mode-edit .mode-panel-dot { background: var(--color-warning); }
    .mode-panel-badge:hover { background: var(--color-selected-bg); }
    .mode-panel-inner .vdf-close {
      position: absolute; bottom: 10px; right: 14px; background: transparent; border: none;
      color: var(--color-text-muted); font-size: 16px; cursor: pointer; line-height: 1;
    }
    .mode-panel-inner .vdf-close:hover { color: white; }
    .mode-panel-handle {
      position: absolute; top: 0; right: 0; width: 30px; height: 30px;
      display: flex; align-items: flex-start; justify-content: flex-end;
      cursor: nesw-resize; touch-action: none;
    }
    .mode-panel-handle-curve {
      width: 13px; height: 13px; margin: 7px 7px 0 0;
      border-top: 2px solid var(--color-text-muted);
      border-right: 2px solid var(--color-text-muted);
      border-top-right-radius: 8px;
    }
    .mode-panel-handle:hover .mode-panel-handle-curve { border-color: white; }

    .week-select-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .week-select-row select { background: var(--color-bg); color: white; border: 1px solid var(--color-border); padding: 8px 10px; border-radius: 6px; font-size: 14px; }

    .day-row { background: var(--color-bg); border: 1px solid var(--color-border-soft); border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .day-row.clickable { cursor: pointer; }
    .day-row.clickable:hover { border-color: var(--color-accent); }
    .day-row .dd-date { color: var(--color-text-dim); font-size: 13px; min-width: 90px; flex-shrink: 0; }
    .day-row .dd-meal { flex: 1; text-align: right; }
    .day-row .dd-meal.dd-empty { color: var(--color-text-muted); font-style: italic; }

    .recipe-section-label { font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; margin: 12px 0 6px; }
    .recipe-section-label:first-child { margin-top: 0; }
    .recipe-ingredients, .recipe-instructions { margin: 0; padding-left: 20px; font-size: 14px; color: var(--color-text-dim); }
    .recipe-ingredients li, .recipe-instructions li { padding: 3px 0; }
    .recipe-loading { color: var(--color-text-muted); font-size: 13px; padding: 10px 0; }

    .recipe-modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px;
    }
    .recipe-modal {
      background: var(--color-surface); border-radius: 10px; padding: 25px 30px;
      max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5); position: relative;
    }
    .recipe-modal-close {
      position: absolute; top: 14px; right: 14px; background: transparent; border: none;
      color: var(--color-text-muted); font-size: 18px; cursor: pointer; line-height: 1;
    }
    .recipe-modal-close:hover { color: white; }
    .recipe-modal h2 { margin-top: 0; font-size: 20px; padding-right: 24px; }

    .edit-swap-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-border-soft); flex-wrap: wrap; font-size: 13px; color: var(--color-text-dim); }
    .edit-swap-row input[type="date"] { background: var(--color-bg); color: white; border: 1px solid var(--color-border); padding: 7px 9px; border-radius: 6px; font-size: 13px; }

    .shopping-item-check { width: 17px; height: 17px; cursor: pointer; flex-shrink: 0; }
    .shopping-item-text { flex: 1; }
    .shopping-item-text.checked { text-decoration: line-through; color: var(--color-text-muted); }
    .shopping-item-del { background: transparent; border: none; color: var(--color-text-muted); cursor: pointer; font-size: 14px; padding: 2px 6px; flex-shrink: 0; }
    .shopping-item-del:hover { color: #ff9d9d; }
    .shopping-add-row { display: flex; gap: 8px; margin-top: 10px; }
    .shopping-add-row input[type="text"] { flex: 1; background: var(--color-bg); color: white; border: 1px solid var(--color-border); padding: 8px 10px; border-radius: 6px; font-size: 14px; }

    .shopping-panel-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .shopping-panel-header h3 { margin: 0; }
    .shopping-group { margin-bottom: 12px; }
    .shopping-group-title { font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 4px; }

    .preview-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--color-border-soft); flex-wrap: wrap; }
    .preview-row:last-of-type { border-bottom: none; }
    .preview-row .date { color: var(--color-text-muted); min-width: 90px; }
    .combo-wrap { position: relative; flex: 1; min-width: 180px; }
    .recipe-combo { width: 100%; background: var(--color-bg); color: white; border: 1px solid var(--color-border); padding: 8px; border-radius: 4px; font-size: 14px; }
    .recipe-combo.is-new { border-color: var(--color-warning-border); }
    .combo-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
    .combo-item { padding: 9px 10px; cursor: pointer; font-size: 14px; }
    .combo-item:hover { background: var(--color-selected-bg); }
    .combo-item.info { color: var(--color-text-muted); font-style: italic; cursor: default; }
    .combo-item.info:hover { background: transparent; }
    .new-hint { font-size: 11px; color: var(--color-warning); margin-top: 2px; display: none; }
    .new-hint.show { display: block; }

    label.check-row { display: block; margin: 10px 0; font-size: 14px; color: var(--color-text-dim); }

    .list-dropdown { background: var(--color-bg); border: 1px solid var(--color-border-soft); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
    .list-dropdown summary { cursor: pointer; font-weight: bold; list-style: none; }
    .list-dropdown summary::-webkit-details-marker { display: none; }
    .list-dropdown summary::before { content: '\25B6'; display: inline-block; margin-right: 8px; font-size: 11px; transition: transform 0.15s; }
    .list-dropdown[open] summary::before { transform: rotate(90deg); }
    .list-dropdown ul { margin-top: 10px; }

    .book-input-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .book-input-row input[type="text"] { flex: 1; min-width: 200px; background: var(--color-bg); color: white; border: 1px solid var(--color-border); padding: 10px; border-radius: 6px; font-size: 14px; }
    .yt-player-wrap { position: relative; width: 100%; padding-top: 56.25%; margin: 12px 0; background: #000; border-radius: 6px; overflow: hidden; }
    .yt-player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .local-player-wrap { margin: 12px 0; }
    .local-player-wrap audio { width: 100%; }
    .no-book-msg { color: var(--color-text-muted); font-size: 14px; }
    .autosave-note { font-size: 12px; color: #7cb87c; margin-top: 8px; }
    .last-saved-note { font-size: 12px; color: var(--color-text-dim); margin-top: 4px; }
    .resume-position-note { font-size: 12px; color: var(--color-warning); margin-top: 2px; font-weight: bold; }
    .manual-save-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .manual-save-row input[type="text"] { width: 90px; background: var(--color-surface); color: white; border: 1px solid var(--color-border); padding: 6px; border-radius: 4px; font-size: 12px; }
    .sleep-timer-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .sleep-timer-active { font-size: 12px; color: var(--color-warning); margin-top: 6px; }
    .custom-timer-input { width: 55px; }
    .book-description { font-size: 13px; color: var(--color-text-dim); margin-top: 10px; white-space: pre-wrap; max-height: 80px; overflow: hidden; }
    .book-description.expanded { max-height: none; }
    .desc-toggle { font-size: 12px; color: var(--color-accent); cursor: pointer; margin-top: 4px; display: inline-block; }
    .book-comment { background: var(--color-surface); border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: 12px; }
    .book-comment .comment-author { color: var(--color-accent); font-weight: bold; margin-bottom: 2px; }
    .checkpoint-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
    .checkpoint-time { font-size: 12px; color: var(--color-text-dim); }
    .stream-details-toggle {
      background: var(--color-bg);
      border: 1px solid var(--color-border-soft);
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 12px;
    }
    .stream-details-toggle summary {
      cursor: pointer;
      font-weight: bold;
      list-style: none;
      font-size: 13px;
      color: var(--color-text-dim);
    }
    .stream-details-toggle summary::-webkit-details-marker { display: none; }
    .stream-details-toggle summary::before {
      content: '\25B6';
      display: inline-block;
      margin-right: 8px;
      font-size: 11px;
      transition: transform 0.15s;
    }
    .stream-details-toggle[open] summary::before { transform: rotate(90deg); }
    .stream-details-body { margin-top: 12px; }
    .details-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #333; }
    .details-section:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    .book-card { background: var(--color-bg); border: 1px solid var(--color-border-soft); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .book-card-header { display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .book-thumb { width: 90px; height: 51px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #000; }
    .book-thumb-local {
      width: 90px; height: 51px; border-radius: 4px; flex-shrink: 0;
      background: var(--color-selected-bg); display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .book-card-info { flex: 1; min-width: 0; }
    .book-card-info .btitle { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-card-info .bmeta { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
    .book-card-expand-icon { font-size: 12px; color: var(--color-text-muted); padding: 6px; }
    .book-card-body { margin-top: 12px; display: none; }
    .book-card-body.open { display: block; }
    .book-controls-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .book-controls-row input[type="text"] { width: 90px; background: var(--color-surface); color: white; border: 1px solid var(--color-border); padding: 6px; border-radius: 4px; font-size: 12px; }
    .book-controls-row .lbl { font-size: 12px; color: var(--color-text-dim); }
    .section-title { font-size: 18px; margin: 20px 0 10px; color: #ddd; }

    .dropzone {
      border: 2px dashed var(--color-border);
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      color: var(--color-text-muted);
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--color-accent); background: #233047; color: var(--color-accent); }
    .dropzone input[type="file"] { display: none; }
    .upload-progress { font-size: 12px; color: var(--color-warning); margin-top: 8px; display: none; }

    .profile-picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 15px 0; }
    .profile-card { position: relative; background: var(--color-surface); border: 2px solid transparent; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; font-size: 16px; font-weight: bold; min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .profile-card:hover { border-color: var(--color-accent); }
    .profile-card.add-card { color: var(--color-text-muted); font-size: 32px; border: 2px dashed var(--color-border); }
    .profile-card.add-card:hover { border-color: var(--color-accent); color: var(--color-accent); }
    .profile-card-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
    .profile-card-icon { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 4px; padding: 4px 7px; font-size: 12px; cursor: pointer; color: white; }
    .profile-card-icon:hover { border-color: var(--color-accent); }
    .profile-card-icon.del:hover { border-color: var(--color-danger-border); }
    .profile-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .profile-bar .who { font-size: 15px; color: var(--color-text-dim); }
    .profile-bar .who b { color: white; }

    #status-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #status-modal {
      background: var(--color-surface);
      border-radius: 10px;
      padding: 30px 35px;
      min-width: 260px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #status-modal.error { border: 2px solid var(--color-danger-border); }
    #status-modal.success { border: 2px solid var(--color-accent); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-message { font-size: 16px; }
    #status-dismiss {
      display: none;
      margin-top: 18px;
      background: var(--color-accent);
      color: var(--color-bg);
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #app-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border-soft);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .app-header-brand {
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .app-header-brand:hover { color: var(--color-accent); }
    #app-nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav-link {
      background: transparent;
      color: var(--color-text-dim);
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: var(--radius-xs);
      font-size: 13px;
      cursor: pointer;
    }
    .nav-link:hover { border-color: var(--color-border); color: white; }
    .nav-link.active { background: var(--color-selected-bg); color: white; border-color: var(--color-accent); }

    .st-device-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-border-soft); }
    .st-device-row:last-of-type { border-bottom: none; }
    .st-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .st-status-dot.connected { background: #7cb87c; }
    .st-status-dot.paused { background: var(--color-warning); }
    .st-status-dot.offline { background: var(--color-text-muted); }
    .st-device-info { flex: 1; min-width: 0; }
    .st-device-name { font-weight: bold; font-size: 15px; }
    .st-device-name-text { cursor: pointer; }
    .st-device-name-text:hover { text-decoration: underline; color: var(--color-accent); }
    .st-device-meta { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
    .st-device-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .st-gui-link-wrap { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; }
    .st-gui-link { font-size: 12px; font-weight: normal; color: var(--color-accent); text-decoration: none; }
    .st-gui-link:hover { text-decoration: underline; }
    .st-gui-port-edit { cursor: pointer; font-size: 11px; color: var(--color-text-muted); }
    .st-gui-port-edit:hover { color: white; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 24px; margin-bottom: 20px; }
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .cal-day { min-height: 50px; font-size: 10px; }
    }
  </style>
</head>
