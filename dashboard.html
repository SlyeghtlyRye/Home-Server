<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header id="app-header">
    <div class="app-header-inner">
      <div class="app-header-brand" data-nav="grid">&#x1F3E0; Home Management</div>
      <nav id="app-nav">
        <button class="nav-link" data-nav="pihole">Pi-hole</button>
        <button class="nav-link" data-nav="mealie">Mealie</button>
        <button class="nav-link" data-nav="kanboard">Kanboard</button>
        <button class="nav-link" data-nav="audiobooks">Streams</button>
        <button class="nav-link" data-nav="syncthing">Syncthing</button>
        <button class="nav-link" data-nav="docs">Docs</button>
        <button class="nav-link" data-nav="system">System</button>
      </nav>
    </div>
  </header>
  <div class="container">
    <div id="grid-view">
      <div class="grid">
        <div class="card" data-app="pihole">
          <h2>&#x1F6E1; Pi-hole</h2>
          <p>Ad Blocking & DNS</p>
        </div>
        <div class="card" data-app="mealie">
          <h2>&#x1F374; Mealie</h2>
          <p>Meal Planning & Groceries</p>
        </div>
        <div class="card" data-app="kanboard">
          <h2>&#x2713; Kanboard</h2>
          <p>Chores & Tasks</p>
        </div>
        <div class="card" data-app="audiobooks">
          <h2>&#x1F3A7; Streams</h2>
          <p>Watch & Listen</p>
        </div>
        <div class="card" data-app="syncthing">
          <h2>&#x1F504; Syncthing</h2>
          <p>Device Sync</p>
        </div>
        <div class="card" data-app="docs">
          <h2>&#x1F4DA; Docs</h2>
          <p>How this system works</p>
        </div>
        <div class="card" data-app="system">
          <h2>&#x2699;&#xFE0F; System</h2>
          <p>Status & factory reset</p>
        </div>
      </div>
    </div>

    <div id="detail-view">
      <button class="back-btn">&larr; Back</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="status-overlay">
    <div id="status-modal">
      <div class="spinner" id="status-spinner"></div>
      <div id="status-message"></div>
      <button id="status-dismiss">OK</button>
    </div>
  </div>

  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/static-apps.js"></script>
  <script type="module" src="js/mealie.js"></script>
  <script type="module" src="js/streams.js"></script>
  <script type="module" src="js/syncthing.js"></script>
  <script type="module" src="js/docs.js"></script>
  <script type="module" src="js/system.js"></script>
  <script type="module" src="js/wizard.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
