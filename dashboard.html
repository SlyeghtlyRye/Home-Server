<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 15px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; font-size: 32px; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #2d2d2d; padding: 25px; border-radius: 8px; text-align: center; cursor: pointer; transition: transform 0.2s; border: 2px solid transparent; }
    .card:hover { transform: scale(1.05); border-color: #64b5f6; }
    .card h2 { margin-top: 0; font-size: 24px; margin-bottom: 10px; }
    .card p { margin: 0; font-size: 16px; color: #bbb; }
    #detail-view { display: none; }
    .back-btn { background: #2d2d2d; color: white; border: 1px solid #555; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-size: 15px; }
    .back-btn:hover { border-color: #64b5f6; }
    .goto-btn { display: inline-block; background: #64b5f6; color: #1a1a1a; font-weight: bold; padding: 12px 20px; border-radius: 6px; text-decoration: none; margin-top: 15px; }
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
    .btn { background: #2d2d2d; color: white; border: 2px solid transparent; padding: 14px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .btn:hover { border-color: #64b5f6; }
    .btn.clear { background: #3a2323; }
    .btn.small { padding: 8px 14px; font-size: 13px; }
    .icon-btn-delete {
      background: #3a2323;
      color: #ff9d9d;
      border: 1px solid #c0392b;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }
    .icon-btn-delete:hover { background: #4a2b2b; }
    .icon-btn-erase {
      background: #3a2f1a;
      color: #ffd479;
      border: 1px solid #b8860b;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }
    .icon-btn-erase:hover { background: #4a3c22; }
    .week-block { background: #2d2d2d; border-radius: 8px; padding: 15px 20px; margin: 15px 0; position: relative; }
    .week-block h3 { margin-top: 0; }
    .shopping-items { list-style: none; padding: 0; margin: 0; }
    .shopping-items li { padding: 6px 0; border-bottom: 1px solid #444; display: flex; gap: 10px; }
    .shopping-items li:last-child { border-bottom: none; }
    .warning-box { background: #3a2f1a; border: 1px solid #b8860b; border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 14px; color: #ffd479; }
    .error-banner { background: #3a2323; border: 1px solid #c0392b; border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 14px; color: #ff9d9d; display: none; }

    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .cal-header-left { display: flex; align-items: center; gap: 10px; }
    .cal-header h3 { margin: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-weekday { text-align: center; color: #888; font-size: 12px; padding: 4px 0; }
    .cal-day { background: #2d2d2d; border-radius: 6px; padding: 6px; min-height: 64px; cursor: pointer; border: 2px solid transparent; font-size: 12px; position: relative; overflow: hidden; }
    .cal-day:hover { border-color: #555; }
    .cal-day.other-month { opacity: 0.3; }
    .cal-day.today { box-shadow: inset 0 0 0 2px #ffb74d; }
    .cal-day.planned { background: #233b2d; }
    .cal-day.included { border-color: #64b5f6 !important; background: #2f4a63; }
    .cal-day.excluded { border-color: #a55; opacity: 0.5; text-decoration: line-through; }
    .cal-daynum { font-weight: bold; }
    .cal-meal { font-size: 10px; color: #bbb; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cal-loading { text-align: center; padding: 40px 0; color: #888; }

    .preview-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #444; flex-wrap: wrap; }
    .preview-row:last-of-type { border-bottom: none; }
    .preview-row .date { color: #888; min-width: 90px; }
    .combo-wrap { position: relative; flex: 1; min-width: 180px; }
    .recipe-combo { width: 100%; background: #1a1a1a; color: white; border: 1px solid #555; padding: 8px; border-radius: 4px; font-size: 14px; }
    .recipe-combo.is-new { border-color: #b8860b; }
    .combo-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border: 1px solid #555;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    }
    .combo-item { padding: 9px 10px; cursor: pointer; font-size: 14px; }
    .combo-item:hover { background: #2f4a63; }
    .combo-item.info { color: #888; font-style: italic; cursor: default; }
    .combo-item.info:hover { background: transparent; }
    .new-hint { font-size: 11px; color: #ffd479; margin-top: 2px; display: none; }
    .new-hint.show { display: block; }

    label.check-row { display: block; margin: 10px 0; font-size: 14px; color: #ccc; }

    .list-dropdown { background: #1a1a1a; border: 1px solid #444; border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
    .list-dropdown summary { cursor: pointer; font-weight: bold; list-style: none; }
    .list-dropdown summary::-webkit-details-marker { display: none; }
    .list-dropdown summary::before { content: '\25B6'; display: inline-block; margin-right: 8px; font-size: 11px; transition: transform 0.15s; }
    .list-dropdown[open] summary::before { transform: rotate(90deg); }
    .list-dropdown ul { margin-top: 10px; }

    .book-input-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .book-input-row input[type="text"] { flex: 1; min-width: 200px; background: #1a1a1a; color: white; border: 1px solid #555; padding: 10px; border-radius: 6px; font-size: 14px; }
    .yt-player-wrap { position: relative; width: 100%; padding-top: 56.25%; margin: 12px 0; background: #000; border-radius: 6px; overflow: hidden; }
    .yt-player-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .local-player-wrap { margin: 12px 0; }
    .local-player-wrap audio { width: 100%; }
    .no-book-msg { color: #888; font-size: 14px; }
    .autosave-note { font-size: 12px; color: #7cb87c; margin-top: 8px; }
    .last-saved-note { font-size: 12px; color: #ccc; margin-top: 4px; }
    .resume-position-note { font-size: 12px; color: #ffd479; margin-top: 2px; font-weight: bold; }
    .manual-save-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .manual-save-row input[type="text"] { width: 90px; background: #2d2d2d; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 12px; }
    .sleep-timer-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .sleep-timer-active { font-size: 12px; color: #ffd479; margin-top: 6px; }
    .custom-timer-input { width: 55px; }
    .book-description { font-size: 13px; color: #ccc; margin-top: 10px; white-space: pre-wrap; max-height: 80px; overflow: hidden; }
    .book-description.expanded { max-height: none; }
    .desc-toggle { font-size: 12px; color: #64b5f6; cursor: pointer; margin-top: 4px; display: inline-block; }
    .book-comment { background: #2d2d2d; border-radius: 6px; padding: 8px 10px; margin-top: 6px; font-size: 12px; }
    .book-comment .comment-author { color: #64b5f6; font-weight: bold; margin-bottom: 2px; }
    .checkpoint-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 0; }
    .checkpoint-time { font-size: 12px; color: #ccc; }
    .stream-details-toggle {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 12px;
    }
    .stream-details-toggle summary {
      cursor: pointer;
      font-weight: bold;
      list-style: none;
      font-size: 13px;
      color: #ccc;
    }
    .stream-details-toggle summary::-webkit-details-marker { display: none; }
    .stream-details-toggle summary::before {
      content: '\25B6';
      display: inline-block;
      margin-right: 8px;
      font-size: 11px;
      transition: transform 0.15s;
    }
    .stream-details-toggle[open] summary::before { transform: rotate(90deg); }
    .stream-details-body { margin-top: 12px; }
    .details-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid #333; }
    .details-section:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    .book-card { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .book-card-header { display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .book-thumb { width: 90px; height: 51px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #000; }
    .book-thumb-local {
      width: 90px; height: 51px; border-radius: 4px; flex-shrink: 0;
      background: #2f4a63; display: flex; align-items: center; justify-content: center;
      font-size: 24px;
    }
    .book-card-info { flex: 1; min-width: 0; }
    .book-card-info .btitle { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .book-card-info .bmeta { font-size: 12px; color: #888; margin-top: 2px; }
    .book-card-expand-icon { font-size: 12px; color: #888; padding: 6px; }
    .book-card-body { margin-top: 12px; display: none; }
    .book-card-body.open { display: block; }
    .book-controls-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .book-controls-row input[type="text"] { width: 90px; background: #2d2d2d; color: white; border: 1px solid #555; padding: 6px; border-radius: 4px; font-size: 12px; }
    .book-controls-row .lbl { font-size: 12px; color: #ccc; }
    .section-title { font-size: 18px; margin: 20px 0 10px; color: #ddd; }

    .dropzone {
      border: 2px dashed #555;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      color: #888;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: #64b5f6; background: #233047; color: #64b5f6; }
    .dropzone input[type="file"] { display: none; }
    .upload-progress { font-size: 12px; color: #ffd479; margin-top: 8px; display: none; }

    .profile-picker-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 15px 0; }
    .profile-card { position: relative; background: #2d2d2d; border: 2px solid transparent; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; font-size: 16px; font-weight: bold; min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .profile-card:hover { border-color: #64b5f6; }
    .profile-card.add-card { color: #888; font-size: 32px; border: 2px dashed #555; }
    .profile-card.add-card:hover { border-color: #64b5f6; color: #64b5f6; }
    .profile-card-actions { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
    .profile-card-icon { background: #1a1a1a; border: 1px solid #555; border-radius: 4px; padding: 4px 7px; font-size: 12px; cursor: pointer; color: white; }
    .profile-card-icon:hover { border-color: #64b5f6; }
    .profile-card-icon.del:hover { border-color: #c0392b; }
    .profile-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .profile-bar .who { font-size: 15px; color: #bbb; }
    .profile-bar .who b { color: white; }

    #status-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #status-modal {
      background: #2d2d2d;
      border-radius: 10px;
      padding: 30px 35px;
      min-width: 260px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #status-modal.error { border: 2px solid #c0392b; }
    #status-modal.success { border: 2px solid #64b5f6; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #555;
      border-top-color: #64b5f6;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-message { font-size: 16px; }
    #status-dismiss {
      display: none;
      margin-top: 18px;
      background: #64b5f6;
      color: #1a1a1a;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 24px; margin-bottom: 20px; }
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .cal-day { min-height: 50px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="grid-view">
      <h1>&#x1F3E0; Home Management</h1>
      <div class="grid">
        <div class="card" data-app="pihole">
          <h2>&#x1F6E1; Pi-hole</h2>
          <p>Ad Blocking & DNS</p>
        </div>
        <div class="card" data-app="mealie">
          <h2>&#x1F374; Mealie</h2>
          <p>Meal Planning & Groceries</p>
        </div>
        <div class="card" data-app="kanboard">
          <h2>&#x2713; Kanboard</h2>
          <p>Chores & Tasks</p>
        </div>
        <div class="card" data-app="audiobooks">
          <h2>&#x1F3A7; Streams</h2>
          <p>Watch & Listen</p>
        </div>
      </div>
    </div>

    <div id="detail-view">
      <button class="back-btn">&larr; Back</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="status-overlay">
    <div id="status-modal">
      <div class="spinner" id="status-spinner"></div>
      <div id="status-message"></div>
      <button id="status-dismiss">OK</button>
    </div>
  </div>

  <script type="module" src="js/core.js"></script>
  <script type="module" src="js/static-apps.js"></script>
  <script type="module" src="js/mealie.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const APPS = {
      pihole: { title: '&#x1F6E1; Pi-hole', url: 'http://192.168.0.201:8080/admin' },
      kanboard: { title: '&#x2713; Kanboard', url: 'http://192.168.0.201:3000' },
      mealie: { title: '&#x1F374; Mealie', url: 'http://192.168.0.201:9000' },
      audiobooks: { title: '&#x1F3A7; Streams', url: null },
    };

    let calendarMonth = new Date();
    let plannedMap = {};
    let weekSelection = null;
    let previewPicks = null;
    let avoidRepeats = localStorage.getItem('mealie_avoidRepeats') !== 'false';
    let allRecipes = [];

    let audiobookProfiles = [];
    let activeProfile = localStorage.getItem('audiobook_profile') || null;
    let audiobookLibrary = [];

    let ytApiReady = false;
    let ytPendingInit = null;
    let ytPlayers = {};
    let ytIntervals = {};
    let sleepTimerCountdowns = {};

    window.onYouTubeIframeAPIReady = function () {
      ytApiReady = true;
      if (ytPendingInit) {
        const fn = ytPendingInit;
        ytPendingInit = null;
        fn();
      }
    };

    function showStatusModal(message, kind) {
      const overlay = document.getElementById('status-overlay');
      const modal = document.getElementById('status-modal');
      const spinner = document.getElementById('status-spinner');
      const dismiss = document.getElementById('status-dismiss');
      document.getElementById('status-message').textContent = message;
      modal.classList.remove('error', 'success');
      if (kind === 'loading') {
        spinner.style.display = 'block';
        dismiss.style.display = 'none';
      } else if (kind === 'success') {
        spinner.style.display = 'none';
        dismiss.style.display = 'none';
        modal.classList.add('success');
      } else if (kind === 'error') {
        spinner.style.display = 'none';
        dismiss.style.display = 'inline-block';
        modal.classList.add('error');
      }
      overlay.style.display = 'flex';
    }

    function hideStatusModal() {
      document.getElementById('status-overlay').style.display = 'none';
    }

    function showSuccessThenClose(message, delay) {
      showStatusModal(message, 'success');
      setTimeout(hideStatusModal, delay || 1500);
    }

    function showErrorBanner(message) {
      const el = document.getElementById('conn-error-banner');
      if (!el) return;
      el.textContent = '\u26A0 ' + message;
      el.style.display = 'block';
    }

    function clearErrorBanner() {
      const el = document.getElementById('conn-error-banner');
      if (!el) return;
      el.style.display = 'none';
      el.textContent = '';
    }

    function stopAudiobookPlayer() {
      Object.keys(ytPlayers).forEach(id => stopBookPlayer(id));
    }

    function showGrid() {
      stopAudiobookPlayer();
      document.getElementById('grid-view').style.display = 'block';
      document.getElementById('detail-view').style.display = 'none';
    }

    function showDetail(app) {
      if (app !== 'audiobooks') stopAudiobookPlayer();
      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      const info = APPS[app];
      const content = document.getElementById('detail-content');

      if (app === 'mealie') {
        content.innerHTML = `
          <h1>${info.title}</h1>
          <div id="conn-error-banner" class="error-banner"></div>
          <div class="week-block">
            <div id="calendar-container"><div class="cal-loading">Loading calendar...</div></div>
          </div>
          <div id="action-panel"></div>
          <div id="preview-panel"></div>
          <div id="shopping-list-panel"></div>
          <a class="goto-btn" href="${info.url}" target="_blank">Open Mealie &rarr;</a>
        `;
        calendarMonth = new Date();
        weekSelection = null;
        previewPicks = null;
        loadRecipes();
        loadMonthMealplan();
        renderActionPanel();
        refreshShoppingPanel();
      } else if (app === 'audiobooks') {
        content.innerHTML = `<h1>${info.title}</h1><div id="audiobooks-root"></div>`;
        loadAudiobookProfiles();
      } else {
        content.innerHTML = `
          <h1>${info.title}</h1>
          <p style="color:#888;">More info coming soon.</p>
          <a class="goto-btn" href="${info.url}" target="_blank">Open ${app} &rarr;</a>
        `;
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function isoOf(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function changeMonth(delta) {
      calendarMonth.setMonth(calendarMonth.getMonth() + delta);
      document.getElementById('calendar-container').innerHTML = '<div class="cal-loading">Loading calendar...</div>';
      loadMonthMealplan();
    }

    async function loadMonthMealplan() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstOfMonth = new Date(year, month, 1);
      const startWeekday = firstOfMonth.getDay();
      const gridStart = new Date(year, month, 1 - startWeekday);
      const gridEnd = new Date(gridStart);
      gridEnd.setDate(gridEnd.getDate() + 41);

      try {
        const res = await fetch(`/data/range-mealplan?start=${isoOf(gridStart)}&end=${isoOf(gridEnd)}`);
        if (!res.ok) throw new Error('server responded ' + res.status);
        const data = await res.json();
        plannedMap = {};
        (data.entries || []).forEach(e => { plannedMap[e.date] = e.recipe; });
        clearErrorBanner();
      } catch (err) {
        console.error('Failed to load month mealplan', err);
        plannedMap = {};
        showErrorBanner("Couldn't reach the server to load the calendar. Check that it's running and try again.");
      }
      renderCalendar();
      refreshShoppingPanel();
    }

    function renderCalendar() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstOfMonth = new Date(year, month, 1);
      const startWeekday = firstOfMonth.getDay();
      const gridStart = new Date(year, month, 1 - startWeekday);
      const todayIso = isoOf(new Date());

      let html = `
        <div class="cal-header">
          <div class="cal-header-left">
            <button class="btn small" onclick="changeMonth(-1)">&larr;</button>
            <h3>${firstOfMonth.toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
            <button class="btn small" onclick="changeMonth(1)">&rarr;</button>
          </div>
          ${weekSelection ? `<button class="btn small clear" onclick="clearSelection()">Clear Selection (${Object.keys(weekSelection.days).length} days)</button>` : ''}
        </div>
        <div class="cal-grid">
          ${['S','M','T','W','T','F','S'].map(d => `<div class="cal-weekday">${d}</div>`).join('')}
      `;

      for (let i = 0; i < 42; i++) {
        const d = new Date(gridStart);
        d.setDate(d.getDate() + i);
        const iso = isoOf(d);
        const inMonth = d.getMonth() === month;
        const meal = plannedMap[iso];
        let cls = 'cal-day';
        if (!inMonth) cls += ' other-month';
        if (iso === todayIso) cls += ' today';
        if (meal) cls += ' planned';
        if (weekSelection && iso in weekSelection.days) {
          cls += weekSelection.days[iso] ? ' included' : ' excluded';
        }
        html += `
          <div class="${cls}" onclick="onDayClick('${iso}')">
            <div class="cal-daynum">${d.getDate()}</div>
            ${meal ? `<div class="cal-meal">${escapeHtml(meal)}</div>` : ''}
          </div>
        `;
      }
      html += `</div>`;
      document.getElementById('calendar-container').innerHTML = html;
    }

    function onDayClick(iso) {
      if (!weekSelection) {
        const start = new Date(iso + 'T00:00:00');
        const days = {};
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          days[isoOf(d)] = true;
        }
        weekSelection = { days };
      } else if (!(iso in weekSelection.days)) {
        const start = new Date(iso + 'T00:00:00');
        for (let i = 0; i < 7; i++) {
          const d = new Date(start);
          d.setDate(d.getDate() + i);
          const key = isoOf(d);
          if (!(key in weekSelection.days)) {
            weekSelection.days[key] = true;
          }
        }
      } else {
        weekSelection.days[iso] = !weekSelection.days[iso];
      }
      previewPicks = null;
      renderCalendar();
      renderActionPanel();
      refreshShoppingPanel();
    }

    function clearSelection() {
      weekSelection = null;
      previewPicks = null;
      renderCalendar();
      renderActionPanel();
      refreshShoppingPanel();
    }

    function excludeAllFridays() {
      if (!weekSelection) return;
      Object.keys(weekSelection.days).forEach(iso => {
        const d = new Date(iso + 'T00:00:00');
        if (d.getDay() === 5) {
          weekSelection.days[iso] = false;
        }
      });
      previewPicks = null;
      renderCalendar();
      renderActionPanel();
      refreshShoppingPanel();
    }

    function includedDates() {
      if (!weekSelection) return [];
      return Object.keys(weekSelection.days).filter(d => weekSelection.days[d]).sort();
    }

    function toggleAvoidRepeats(checked) {
      avoidRepeats = checked;
      localStorage.setItem('mealie_avoidRepeats', checked ? 'true' : 'false');
    }

    function renderActionPanel() {
      const el = document.getElementById('action-panel');
      document.getElementById('preview-panel').innerHTML = '';
      if (!weekSelection) {
        el.innerHTML = '';
        return;
      }
      const included = includedDates();
      const totalSelected = Object.keys(weekSelection.days).length;
      el.innerHTML = `
        <div class="week-block">
          <h3>Selected Days</h3>
          <p style="color:#bbb; font-size:14px;">
            Click an empty day to add another 7-day block onto your selection. Click a selected day again to include/exclude it.
            ${included.length} of ${totalSelected} selected day(s) will be planned.
          </p>
          <label class="check-row">
            <input type="checkbox" id="avoid-repeats-check" ${avoidRepeats ? 'checked' : ''} onchange="toggleAvoidRepeats(this.checked)">
            Avoid recipes used in the last week
          </label>
          <div class="btn-grid">
            <button class="btn small" onclick="excludeAllFridays()">Exclude All Fridays</button>
          </div>
          <div class="btn-grid">
            <button class="btn" onclick="planSelected()">Plan Selected Days</button>
            <button class="btn clear" onclick="clearSelectedDays()">Clear Selected Days</button>
            <button class="btn" onclick="clearSelection()">Cancel Selection</button>
          </div>
        </div>
      `;
    }

    async function loadRecipes() {
      try {
        const res = await fetch('/data/recipes');
        if (!res.ok) throw new Error('server responded ' + res.status);
        const data = await res.json();
        allRecipes = data.recipes || [];
        clearErrorBanner();
      } catch (err) {
        console.error('Failed to load recipes', err);
        allRecipes = [];
        showErrorBanner("Couldn't load your recipe list from the server. Check that it's running and try again.");
      }
    }

    async function planSelected() {
      const dates = includedDates();
      if (dates.length === 0) { alert('Select at least one day first.'); return; }

      const conflicts = dates.filter(d => plannedMap[d]);
      if (conflicts.length > 0) {
        const list = conflicts.map(d => `${d} (${plannedMap[d]})`).join('\n');
        const proceed = confirm(
          `${conflicts.length} of your selected day(s) already have a meal planned:\n\n${list}\n\nContinuing will replace them. Proceed?`
        );
        if (!proceed) return;
      }

      showStatusModal('Building preview...', 'loading');
      try {
        const res = await fetch('/api/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dates, avoidRepeats })
        });
        const data = await res.json();
        if (!res.ok) { showStatusModal('Failed: ' + (data.error || res.status), 'error'); return; }
        previewPicks = data.picks;
        hideStatusModal();
        renderPreviewPanel(conflicts);
      } catch (err) {
        showStatusModal('Error: ' + err, 'error');
      }
    }

    function removePreviewDay(dateStr) {
      if (!previewPicks) return;
      previewPicks = previewPicks.filter(p => p.date !== dateStr);
      if (previewPicks.length === 0) {
        previewPicks = null;
      }
      renderPreviewPanel();
    }

    function clearPreviewDay(dateStr) {
      if (!previewPicks) return;
      const entry = previewPicks.find(p => p.date === dateStr);
      if (!entry) return;
      entry.recipeId = null;
      entry.recipeName = '';
      entry.isNew = false;
      renderPreviewPanel();
    }

    function getFilteredRecipes(term) {
      const t = (term || '').trim().toLowerCase();
      if (!t) return allRecipes;
      return allRecipes.filter(r => r.name.toLowerCase().includes(t));
    }

    function renderComboDropdownHtml(term) {
      const filtered = getFilteredRecipes(term);
      const t = (term || '').trim();
      if (filtered.length === 0) {
        if (!t) return `<div class="combo-item info">No recipes yet</div>`;
        return `<div class="combo-item info">No match &mdash; "${escapeHtml(t)}" will be created as new on save</div>`;
      }
      return filtered.map(r =>
        `<div class="combo-item" onmousedown="event.preventDefault(); selectComboItem('${r.id}', this)">${escapeHtml(r.name)}</div>`
      ).join('');
    }

    function onComboFocus(dateStr, inputEl) {
      inputEl.dataset.date = dateStr;
      const dropdown = document.getElementById('dropdown-' + dateStr);
      if (!dropdown) return;
      dropdown.innerHTML = renderComboDropdownHtml(inputEl.value);
      dropdown.style.display = 'block';
    }

    function onComboType(dateStr, inputEl) {
      const typedValue = inputEl.value;
      const entry = previewPicks.find(p => p.date === dateStr);
      const hint = document.getElementById('hint-' + dateStr);
      if (entry) {
        const match = allRecipes.find(r => r.name.toLowerCase() === typedValue.trim().toLowerCase());
        if (match) {
          entry.recipeId = match.id;
          entry.recipeName = match.name;
          entry.isNew = false;
          inputEl.classList.remove('is-new');
          if (hint) hint.classList.remove('show');
        } else {
          entry.recipeId = null;
          entry.recipeName = typedValue.trim();
          entry.isNew = true;
          inputEl.classList.add('is-new');
          if (hint) hint.classList.toggle('show', typedValue.trim().length > 0);
        }
      }
      const dropdown = document.getElementById('dropdown-' + dateStr);
      if (dropdown) {
        dropdown.innerHTML = renderComboDropdownHtml(typedValue);
        dropdown.style.display = 'block';
      }
    }

    function selectComboItem(recipeId, itemEl) {
      const dropdown = itemEl.closest('.combo-dropdown');
      const dateStr = dropdown.id.replace('dropdown-', '');
      const recipe = allRecipes.find(r => r.id === recipeId);
      const entry = previewPicks.find(p => p.date === dateStr);
      if (!recipe || !entry) return;
      entry.recipeId = recipe.id;
      entry.recipeName = recipe.name;
      entry.isNew = false;
      const inputEl = document.getElementById('input-' + dateStr);
      if (inputEl) {
        inputEl.value = recipe.name;
        inputEl.classList.remove('is-new');
      }
      const hint = document.getElementById('hint-' + dateStr);
      if (hint) hint.classList.remove('show');
      dropdown.style.display = 'none';
    }

    function onComboBlur(dateStr) {
      setTimeout(() => {
        const dropdown = document.getElementById('dropdown-' + dateStr);
        if (dropdown) dropdown.style.display = 'none';
      }, 150);
    }

    function renderPreviewPanel(conflicts) {
      conflicts = conflicts || [];
      const el = document.getElementById('preview-panel');
      if (!previewPicks) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="week-block">
          <h3>Preview</h3>
          <p style="color:#888; font-size:13px;">Tap a field to see your recipes, type to filter. If nothing matches, it'll be created as new automatically on save.</p>
          ${conflicts.length > 0 ? `<div class="warning-box">&#x26A0; ${conflicts.length} day(s) will overwrite an existing planned meal.</div>` : ''}

                  class="recipe-combo ${p.isNew ? 'is-new' : ''}"
                  type="text"

              <button class="btn small" onclick="rerollDay('${p.date}')">Reroll</button>
              <button class="icon-btn-erase" onclick="clearPreviewDay('${p.date}')" title="Clear this day's recipe">&#x2716;</button>
              <button class="icon-btn-delete" onclick="removePreviewDay('${p.date}')" title="Remove this day">&#x1F5D1;</button>
            </div>
          `).join('')}
          <div class="btn-grid" style="margin-top:15px;">

    function cancelPreview() {
      previewPicks = null;
      renderPreviewPanel();
    }

    async function rerollDay(dateStr) {
      const excludeIds = previewPicks.filter(p => p.recipeId).map(p => p.recipeId);
      try {
        const res = await fetch('/api/reroll', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: dateStr, avoidRepeats, excludeIds })
        });
        const data = await res.json();
        if (!res.ok) { showStatusModal('Reroll failed: ' + (data.error || res.status), 'error'); return; }
        const entry = previewPicks.find(p => p.date === dateStr);
        if (entry) {
          entry.recipeId = data.pick.recipeId;
          entry.recipeName = data.pick.recipeName;
          entry.isNew = false;
        }
        renderPreviewPanel();
      } catch (err) {
        showStatusModal('Reroll error: ' + err, 'error');
      }
    }

    async function pollUntilDone(maxAttempts = 30) {
      for (let i = 0; i < maxAttempts; i++) {
        await new Promise(r => setTimeout(r, 1000));
        try {
          const res = await fetch('/data/status');
          const data = await res.json();
          if (!data.running) return;
        } catch (err) {
          return;
        }
      }
    }

    async function resolveNewRecipes() {
      for (const p of previewPicks) {
        if (p.isNew && !p.recipeId) {
          if (!p.recipeName || !p.recipeName.trim()) {
            throw new Error(`Day ${p.date} has an empty recipe name.`);
          }
          const res = await fetch('/api/create-recipe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: p.recipeName.trim() })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(`Failed to create "${p.recipeName}": ` + (data.error || res.status));
          p.recipeId = data.id;
          p.recipeName = data.name;
          p.isNew = false;
          allRecipes.push({ id: data.id, name: data.name });
        }
      }
    }

    async function commitPreview() {
      if (!previewPicks || previewPicks.length === 0) return;
      const emptyDays = previewPicks.filter(p => !p.recipeId && !(p.isNew && p.recipeName && p.recipeName.trim()));
      if (emptyDays.length > 0) {
        alert(`These days still need a recipe before saving: ${emptyDays.map(p => p.date).join(', ')}`);
        return;
      }
      if (!confirm(`Save these ${previewPicks.length} meal(s) to your calendar?`)) return;
      showStatusModal('Preparing recipes...', 'loading');
      try {
        await resolveNewRecipes();
      } catch (err) {
        showStatusModal(err.message, 'error');
        return;
      }
      showStatusModal('Saving meal plan...', 'loading');
      try {
        const res = await fetch('/api/commit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ picks: previewPicks })
        });
        if (!res.ok) { showStatusModal('Failed to start save.', 'error'); return; }
        showStatusModal('Saving meal plan and updating shopping list...', 'loading');
        await pollUntilDone();
        weekSelection = null;
        previewPicks = null;
        await loadMonthMealplan();
        renderActionPanel();
        refreshShoppingPanel();
        showSuccessThenClose('Saved!');
      } catch (err) {
        showStatusModal('Error: ' + err, 'error');
      }
    }

    async function clearSelectedDays() {
      const dates = includedDates();
      if (dates.length === 0) { alert('Select at least one day first.'); return; }
      if (!confirm(`Clear meals for ${dates.length} day(s)? This cannot be undone.`)) return;
      showStatusModal('Clearing meals...', 'loading');
      try {
        const res = await fetch('/api/clear-dates', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dates })
        });
        if (!res.ok) { showStatusModal('Failed to start clear.', 'error'); return; }
        await pollUntilDone();
        weekSelection = null;
        previewPicks = null;
        await loadMonthMealplan();
        renderActionPanel();
        refreshShoppingPanel();
        showSuccessThenClose('Cleared!');
      } catch (err) {
        showStatusModal('Error: ' + err, 'error');
      }
    }

    async function loadShoppingListsForRange(startIso, endIso) {

      el.innerHTML = '<div class="week-block"><h3>Shopping Lists</h3><p>Loading...</p></div>';

    function refreshShoppingPanel() {
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstOfMonth = new Date(year, month, 1);
      const startWeekday = firstOfMonth.getDay();
      const gridStart = new Date(year, month, 1 - startWeekday);
      const gridEnd = new Date(gridStart);
      gridEnd.setDate(gridEnd.getDate() + 41);
      loadShoppingListsForRange(isoOf(gridStart), isoOf(gridEnd));
    }

    function formatSeconds(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      return `${m}:${String(sec).padStart(2, '0')}`;
    }

    function parseTimeToSeconds(text) {
      const parts = text.trim().split(':').map(p => parseInt(p, 10));
      if (parts.some(isNaN)) return null;
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 1) return parts[0];
      return null;
    }

    function getYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

      const newName = prompt('New name for "' + oldName + '":', oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return;
      try {
        const res = await fetch('/api/audiobook-rename-profile', {

          headers: { 'Content-Type': 'application/json' },

      if (!confirm(`Delete "${name}" and all of their streaming history? This cannot be undone.`)) return;

    function setupDropzone() {
      const zone = document.getElementById('dropzone');
      const input = document.getElementById('local-file-input');

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('dragover');
      });
      zone.addEventListener('dragleave', () => {
        zone.classList.remove('dragover');
      });
      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleLocalFileSelected(e.dataTransfer.files[0]);
        }
      });
      input.addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
          handleLocalFileSelected(e.target.files[0]);
        }
        input.value = '';
      });
    }

    function handleLocalFileSelected(file) {
      const defaultTitle = file.name.replace(/\.[^/.]+$/, '');
      const title = prompt('Title for this stream:', defaultTitle);
      if (!title || !title.trim()) return;
      uploadLocalFile(file, title.trim());
    }

    function uploadLocalFile(file, title) {
      const ext = (file.name.split('.').pop() || 'mp3').toLowerCase();
      const url = `/api/audiobook-upload-local?profile=${encodeURIComponent(activeProfile)}&title=${encodeURIComponent(title)}&ext=${encodeURIComponent(ext)}`;

      const progressEl = document.getElementById('upload-progress');
      progressEl.style.display = 'block';
      progressEl.textContent = 'Uploading... 0%';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressEl.textContent = `Uploading... ${pct}%`;
        }
      };

      xhr.onload = () => {
        progressEl.style.display = 'none';
        if (xhr.status >= 200 && xhr.status < 300) {
          loadAudiobookLibrary();
        } else {
          let msg = 'Upload failed.';
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
          alert(msg);
        }
      };

      xhr.onerror = () => {
        progressEl.style.display = 'none';
        alert('Upload failed due to a network error.');
      };

      xhr.send(file);
    }

    async function loadAudiobookLibrary() {
      try {
        const res = await fetch(`/data/audiobook-library?profile=${encodeURIComponent(activeProfile)}`);
        if (!res.ok) throw new Error('server responded ' + res.status);
        const data = await res.json();
        const youtubeLibrary = data.library || [];
        const localLibrary = data.local || [];
        audiobookLibrary = [...youtubeLibrary, ...localLibrary];
        const recent = data.recent || [];
        renderBookSection('recent-panel', 'Recently Played', recent, true);
        renderBookSection('local-panel', 'Local Files', localLibrary, false, 'No local files uploaded yet. Drop one above to share it with everyone.');
        renderBookSection('history-panel', 'History', [...youtubeLibrary].reverse(), false, 'No streams added yet.');
      } catch (err) {
        console.error('Failed to load audiobook library', err);
        document.getElementById('recent-panel').innerHTML =
          `<div class="week-block"><p style="color:#888;">Couldn't load stream data.</p></div>`;
      }
    }




    function renderBookSection(elementId, title, books, hideWhenEmpty, emptyMsg) {
      const el = document.getElementById(elementId);
      if (books.length === 0) {
        if (hideWhenEmpty) { el.innerHTML = ''; return; }
        el.innerHTML = `<div class="week-block"><h3>${title}</h3><p class="no-book-msg">${emptyMsg || 'No streams added yet.'}</p></div>`;
        return;
      }
      el.innerHTML = `
        <div class="week-block">
          <h3>${title}</h3>
          ${books.map(b => renderBookCard(b)).join('')}
        </div>
      `;
    }

    function renderBookCard(b) {
      const isLocal = b.source === 'local';
      const videoId = isLocal ? null : getYouTubeId(b.url);
      const thumb = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';
      const posLabel = b.resume_seconds > 0 ? `Resumes at ${formatSeconds(b.resume_seconds)}` : 'Not started';
      const stopLabel = b.stop_seconds ? ` &middot; Stops at ${formatSeconds(b.stop_seconds)}` : '';
      const history = b.resume_history || [];
      return `
        <div class="book-card" id="card-${b.id}">
          <div class="book-card-header" onclick="toggleBookCard('${b.id}')">
            
	    ${isLocal
              ? `<div class="book-thumb-local">${b.media_type === 'video' ? '&#x1F3AC;' : '&#x1F3A7;'}</div>`
              : (thumb ? `<img class="book-thumb" src="${thumb}">` : `<div class="book-thumb"></div>`)}

            <div class="book-card-info">
              <div class="btitle">${escapeHtml(b.title)}${isLocal ? ' <span style="color:#888; font-weight:normal; font-size:11px;">(Local)</span>' : ''}</div>
              <div class="bmeta" id="bmeta-${b.id}">${posLabel}${stopLabel}</div>
            </div>
            <div class="book-card-expand-icon" id="expand-icon-${b.id}">&#x25BC;</div>
          </div>
          <div class="book-card-body" id="body-${b.id}">

            <div id="player-wrap-${b.id}"></div>
            <p class="autosave-note">Your spot is saved automatically while this plays.</p>

            ${b.description ? `
              <div>
                <div class="book-description" id="desc-${b.id}">${escapeHtml(b.description)}</div>
                <span class="desc-toggle" onclick="toggleDescription('${b.id}')" id="desc-toggle-${b.id}">Show more</span>
              </div>
            ` : ''}

            <details class="stream-details-toggle">
              <summary>Stream Details</summary>
              <div class="stream-details-body">

                <div class="details-section">
                  <div class="last-saved-note" id="last-saved-${b.id}">Last saved: not yet this session</div>
                  <div class="resume-position-note" id="resume-position-${b.id}">${b.resume_seconds > 0 ? `Resuming from ${formatSeconds(b.resume_seconds)}` : ''}</div>
                  <div class="manual-save-row">
                    <button class="btn small" onclick="manualSaveNow('${b.id}')">Save current position</button>
                    <span class="lbl">or type a time:</span>
                    <input type="text" id="manual-save-input-${b.id}" placeholder="h:mm:ss">
                    <button class="btn small" onclick="manualSaveTyped('${b.id}')">Save this</button>
                  </div>
                </div>

                ${history.length > 0 ? `
                  <div class="details-section">
                    <span class="lbl" style="margin-bottom:6px; display:block;">Previous spots (revert if needed):</span>
                    ${history.map(h => `
                      <div class="checkpoint-row">
                        <button class="btn small" onclick="revertCheckpoint('${b.id}', ${h.seconds})">Revert to ${formatSeconds(h.seconds)}</button>
                        <span class="checkpoint-time">${escapeHtml(h.time)}</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                <div class="details-section">
                  <div class="sleep-timer-row" id="timer-row-${b.id}">
                    <span class="lbl">Sleep timer:</span>
                    <button class="btn small" onclick="setSleepTimer('${b.id}', 15)">15m</button>
                    <button class="btn small" onclick="setSleepTimer('${b.id}', 30)">30m</button>
                    <button class="btn small" onclick="setSleepTimer('${b.id}', 45)">45m</button>
                    <button class="btn small" onclick="setSleepTimer('${b.id}', 60)">60m</button>
                    <input type="number" class="custom-timer-input" id="custom-timer-${b.id}" placeholder="min" min="1">
                    <button class="btn small" onclick="setCustomSleepTimer('${b.id}')">Set</button>
                    <button class="btn small clear" onclick="cancelSleepTimer('${b.id}')">Cancel</button>
                  </div>
                  <div class="sleep-timer-active" id="timer-active-${b.id}"></div>
                </div>

                ${b.chapters && b.chapters.length > 0 ? `
                  <div class="details-section">
                    <span class="lbl" style="margin-bottom:6px; display:block;">Chapters:</span>
                    ${b.chapters.map(c => `
                      <div class="btn small" style="text-align:left; margin-bottom:4px;" onclick="seekToChapter('${b.id}', ${c.start_seconds})">
                        ${formatSeconds(c.start_seconds)} — ${escapeHtml(c.title)}
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                ${b.comments && b.comments.length > 0 ? `
                  <div class="details-section">
                    <span class="lbl" style="margin-bottom:6px; display:block;">Top Comments:</span>
                    ${b.comments.map(c => `
                      <div class="book-comment">
                        <div class="comment-author">${escapeHtml(c.author)}</div>
                        <div>${escapeHtml(c.text)}</div>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}

                <div class="details-section">
                  <div class="book-controls-row">
                    ${!isLocal ? `<a class="btn small" href="${b.url}" target="_blank">Open in YouTube</a>` : ''}
                    <button class="icon-btn-delete" onclick="deleteAudiobook('${b.id}')" title="Delete">&#x1F5D1;</button>
                  </div>
                </div>

              </div>
            </details>

          </div>
        </div>
      `;
    }

    function toggleDescription(bookId) {
      const el = document.getElementById('desc-' + bookId);
      const toggle = document.getElementById('desc-toggle-' + bookId);
      if (!el) return;
      const isExpanded = el.classList.toggle('expanded');
      toggle.textContent = isExpanded ? 'Show less' : 'Show more';
    }

    async function toggleBookCard(bookId) {
      const body = document.getElementById('body-' + bookId);
      const icon = document.getElementById('expand-icon-' + bookId);
      const isOpen = body.classList.contains('open');

      Object.keys(ytPlayers).forEach(id => {
        if (id !== bookId) collapseBookCard(id);
      });

      if (isOpen) {
        collapseBookCard(bookId);
        return;
      }

      body.classList.add('open');
      icon.innerHTML = '&#x25B2;';

      try {
        await fetch('/api/audiobook-record-checkpoint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId })
        });
      } catch (err) {
        console.error('Failed to record checkpoint', err);
      }

      const book = audiobookLibrary.find(x => x.id === bookId);
      if (!book) return;
      const startSeconds = book.resume_seconds || 0;

      if (book.source === 'local') {
        startLocalPlayer(bookId, startSeconds);
      } else {
        const videoId = getYouTubeId(book.url);
        if (videoId) startYouTubePlayer(bookId, videoId, startSeconds);
      }
    }

    function collapseBookCard(bookId) {
      const body = document.getElementById('body-' + bookId);
      const icon = document.getElementById('expand-icon-' + bookId);
      if (body) body.classList.remove('open');
      if (icon) icon.innerHTML = '&#x25BC;';
      stopBookPlayer(bookId);
    }

    function stopBookPlayer(bookId) {
      if (ytIntervals[bookId]) {
        clearInterval(ytIntervals[bookId]);
        delete ytIntervals[bookId];
      }
      if (sleepTimerCountdowns[bookId]) {
        clearInterval(sleepTimerCountdowns[bookId]);
        delete sleepTimerCountdowns[bookId];
      }
      const player = ytPlayers[bookId];
      if (player) {
        if (player.getCurrentTime) {
          autosaveBookPosition(bookId);
        }
        try { player.destroy(); } catch (e) {}
        delete ytPlayers[bookId];
      }
    }

    function startYouTubePlayer(bookId, videoId, startSeconds) {
      const wrap = document.getElementById('player-wrap-' + bookId);
      wrap.innerHTML = `<div class="yt-player-wrap"><div id="yt-player-${bookId}"></div></div>`;

      const createPlayer = () => {
        ytPlayers[bookId] = new YT.Player('yt-player-' + bookId, {
          videoId: videoId,
          playerVars: { start: Math.floor(startSeconds), rel: 0 },
          events: {
            onReady: () => {
              ytIntervals[bookId] = setInterval(() => autosaveBookPosition(bookId), 15000);
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                autosaveBookPosition(bookId);
              }
            }
          }
        });
      };
      if (ytApiReady && window.YT && window.YT.Player) {
        createPlayer();
      } else {
        ytPendingInit = createPlayer;
      }
    }

    // --- LOCAL STREAMS: wraps a native <audio> element to match the YT.Player
    // interface (getCurrentTime/seekTo/pauseVideo/destroy) so every existing
    // resume/sleep-timer/checkpoint function works unchanged for either source. ---
    

    function startLocalPlayer(bookId, startSeconds) {
      const book = audiobookLibrary.find(x => x.id === bookId);
      const isVideo = book && book.media_type === 'video';
      const wrap = document.getElementById('player-wrap-' + bookId);

      wrap.innerHTML = isVideo
        ? `<div class="yt-player-wrap"><video id="local-audio-${bookId}" controls preload="metadata" style="position:absolute; top:0; left:0; width:100%; height:100%;"></video></div>`
        : `<div class="local-player-wrap"><audio id="local-audio-${bookId}" controls preload="metadata"></audio></div>`;

      const mediaEl = document.getElementById('local-audio-' + bookId);
      mediaEl.src = `/data/local-audio?id=${bookId}`;

      const wrapper = {
        el: mediaEl,
        getCurrentTime: () => mediaEl.currentTime,
        seekTo: (seconds) => { mediaEl.currentTime = seconds; },
        pauseVideo: () => mediaEl.pause(),
        destroy: () => {
          mediaEl.pause();
          mediaEl.src = '';
        }
      };
      ytPlayers[bookId] = wrapper;

      mediaEl.addEventListener('loadedmetadata', () => {
        if (startSeconds > 0) mediaEl.currentTime = startSeconds;
      });
      mediaEl.addEventListener('pause', () => autosaveBookPosition(bookId));
      mediaEl.addEventListener('ended', () => autosaveBookPosition(bookId));

      ytIntervals[bookId] = setInterval(() => autosaveBookPosition(bookId), 15000);
    }

    // --- end LOCAL STREAMS ---

    function updateSaveUI(bookId, seconds) {
      const book = audiobookLibrary.find(x => x.id === bookId);
      if (book) book.resume_seconds = seconds;

      const savedEl = document.getElementById('last-saved-' + bookId);
      if (savedEl) savedEl.textContent = 'Last saved: ' + new Date().toLocaleTimeString();

      const resumeEl = document.getElementById('resume-position-' + bookId);
      if (resumeEl) resumeEl.textContent = `Resuming from ${formatSeconds(seconds)}`;

      const metaEl = document.getElementById('bmeta-' + bookId);
      if (metaEl) {
        const stopLabel = book && book.stop_seconds ? ` \u00b7 Stops at ${formatSeconds(book.stop_seconds)}` : '';
        metaEl.textContent = `Resumes at ${formatSeconds(seconds)}${stopLabel}`;
      }
    }

    async function autosaveBookPosition(bookId) {
      const player = ytPlayers[bookId];
      if (!player || !player.getCurrentTime) return;
      const seconds = Math.floor(player.getCurrentTime());
      if (!seconds || seconds < 1) return;

      const book = audiobookLibrary.find(x => x.id === bookId);
      if (book && book.stop_seconds && seconds >= book.stop_seconds) {
        player.pauseVideo();
        stopBookPlayer(bookId);
      }

      try {
        await fetch('/api/audiobook-update-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, resume_seconds: seconds })
        });
        updateSaveUI(bookId, seconds);
      } catch (err) {
        console.error('Autosave failed', err);
      }
    }

    async function manualSaveNow(bookId) {
      const player = ytPlayers[bookId];
      if (!player || !player.getCurrentTime) {
        alert('Start playing this stream first, then you can save your position.');
        return;
      }
      const seconds = Math.floor(player.getCurrentTime());
      try {
        const res = await fetch('/api/audiobook-update-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, resume_seconds: seconds })
        });
        if (!res.ok) { alert('Failed to save.'); return; }
        updateSaveUI(bookId, seconds);
      } catch (err) {
        alert('Error: ' + err);
      }
    }

    async function manualSaveTyped(bookId) {
      const input = document.getElementById('manual-save-input-' + bookId);
      const seconds = parseTimeToSeconds(input.value);
      if (seconds === null) {
        alert('Enter a time like 45, 12:30, or 1:23:45');
        return;
      }
      try {
        const res = await fetch('/api/audiobook-update-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, resume_seconds: seconds, profile: activeProfile })
        });
        if (!res.ok) { alert('Failed to save.'); return; }
        updateSaveUI(bookId, seconds);
        const player = ytPlayers[bookId];
        if (player && player.seekTo) {
          player.seekTo(seconds, true);
        }
        input.value = '';
      } catch (err) {
        alert('Error: ' + err);
      }
    }

    function seekToChapter(bookId, startSeconds) {
      const player = ytPlayers[bookId];
      if (player && player.seekTo) {
        player.seekTo(startSeconds, true);
      }
    }

    async function revertCheckpoint(bookId, seconds) {
      if (!confirm(`Revert to ${formatSeconds(seconds)}? This will replace your current saved spot.`)) return;
      try {
        const res = await fetch('/api/audiobook-revert-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, seconds, profile: activeProfile })
        });
        if (!res.ok) { alert('Failed to revert.'); return; }
        const player = ytPlayers[bookId];
        if (player && player.seekTo) {
          player.seekTo(seconds, true);
        }
        await loadAudiobookLibrary();
      } catch (err) {
        alert('Error: ' + err);
      }
    }

    function setCustomSleepTimer(bookId) {
      const input = document.getElementById('custom-timer-' + bookId);
      const minutes = parseInt(input.value, 10);
      if (!minutes || minutes <= 0) {
        alert('Enter a number of minutes greater than 0.');
        return;
      }
      setSleepTimer(bookId, minutes);
    }

    function setSleepTimer(bookId, minutes) {
      const player = ytPlayers[bookId];
      if (!player || !player.getCurrentTime) {
        alert('Start playing first, then set a sleep timer.');
        return;
      }
      const currentSeconds = Math.floor(player.getCurrentTime());
      const stopAt = currentSeconds + minutes * 60;

      fetch('/api/audiobook-set-stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: bookId, stop_seconds: stopAt, profile: activeProfile })
      }).catch(err => console.error('Failed to set sleep timer', err));

      const book = audiobookLibrary.find(x => x.id === bookId);
      if (book) book.stop_seconds = stopAt;

      if (sleepTimerCountdowns[bookId]) clearInterval(sleepTimerCountdowns[bookId]);

      const updateDisplay = () => {
        const p = ytPlayers[bookId];
        const el = document.getElementById('timer-active-' + bookId);
        if (!p || !el) { clearInterval(sleepTimerCountdowns[bookId]); return; }
        const remaining = stopAt - Math.floor(p.getCurrentTime());
        if (remaining <= 0) {
          el.textContent = 'Stopping...';
          clearInterval(sleepTimerCountdowns[bookId]);
          delete sleepTimerCountdowns[bookId];
          return;
        }
        el.textContent = `Sleep timer: stops in ${formatSeconds(remaining)}`;
      };
      updateDisplay();
      sleepTimerCountdowns[bookId] = setInterval(updateDisplay, 1000);
    }

    async function cancelSleepTimer(bookId) {
      if (sleepTimerCountdowns[bookId]) {
        clearInterval(sleepTimerCountdowns[bookId]);
        delete sleepTimerCountdowns[bookId];
      }
      const el = document.getElementById('timer-active-' + bookId);
      if (el) el.textContent = '';

      const book = audiobookLibrary.find(x => x.id === bookId);
      if (book) book.stop_seconds = null;

      try {
        await fetch('/api/audiobook-set-stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, stop_seconds: null, profile: activeProfile })
        });
      } catch (err) {
        console.error('Failed to cancel sleep timer', err);
      }
    }

    async function addAudiobook() {
      const input = document.getElementById('new-book-url');
      const url = input.value.trim();
      if (!url) { alert('Paste a YouTube link first.'); return; }
      showStatusModal('Fetching video info (title, chapters, comments)...', 'loading');
      try {
        const res = await fetch('/api/audiobook-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, profile: activeProfile })
        });
        const data = await res.json();
        if (!res.ok) { showStatusModal('Failed: ' + (data.error || res.status), 'error'); return; }
        input.value = '';
        hideStatusModal();
        await loadAudiobookLibrary();
      } catch (err) {
        showStatusModal('Error: ' + err, 'error');
      }
    }

    async function deleteAudiobook(bookId) {
      if (!confirm('Remove this stream from your history?')) return;
      stopBookPlayer(bookId);
      try {
        const res = await fetch('/api/audiobook-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: bookId, profile: activeProfile })
        });
        if (!res.ok) { alert('Failed to delete.'); return; }
        await loadAudiobookLibrary();
      } catch (err) {
        alert('Error: ' + err);
      }
    }
  </script>
</body>
