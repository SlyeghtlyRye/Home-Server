x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Image versions are PINNED (not :latest) -- pinned 2026-11-08 to exactly
# the images that were running then (matched by digest), so nothing
# changed on the device. Why: a fresh pull (migrate.py prepare-drive/import
# on a new drive, a re-pull after storage corruption, a new device) used to
# grab whatever :latest meant that day, which could silently jump a major
# version against existing data -- Pi-hole 5->6 already broke configs once.
# To upgrade: bump the tag here, read that app's release notes, commit,
# then update like any other docker-compose.yml change.

services:
  pihole:
    image: pihole/pihole:2026.06.0
    container_name: pihole
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - FTLCONF_interface=eth0
      - FTLCONF_dns_listeningMode=ALL
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./dnsmasq-custom.conf:/etc/dnsmasq.d/05-custom.conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    restart: unless-stopped
    mem_limit: 150m
    logging: *default-logging

  kanboard:
    image: kanboard/kanboard:v1.2.52
    container_name: kanboard
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - kanboard_data:/var/www/html/data
    ports:
      - "3000:80"
    restart: unless-stopped
    mem_limit: 150m
    logging: *default-logging

  nginx:
    image: nginx:1.31.2-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TRIGGER_SECRET=${TRIGGER_SECRET}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./docs:/usr/share/nginx/html/docs:ro
      # Directory mount, not a single-file one -- a single-file bind mount
      # can go stale when the host file is replaced rather than edited in
      # place (the exact issue updater.py's own docstring documents for
      # dashboard.html), which would matter a lot here since the cert
      # gets regenerated whenever HOST_IP changes.
      - ./nginx/certs:/etc/nginx/certs:ro
    # The only container without an image-provided healthcheck -- this
    # gives the System panel a real "serving pages" signal, and lets the
    # staggered restart's `docker compose up --wait` wait for it properly.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Ordering only, for `docker compose up`. nginx no longer *needs* these
    # running to start -- it resolves them per request (see the comment at
    # the top of nginx/templates/default.conf.template).
    depends_on:
      - pihole
      - mealie
      - kanboard
    restart: unless-stopped
    mem_limit: 50m
    logging: *default-logging

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.19.2
    container_name: mealie
    environment:
      - TZ=${TIMEZONE}
      - DB_ENGINE=sqlite
      - BASE_URL=http://${HOST_IP}:9000
      # This device only has ~914Mi RAM total. Mealie's default (Gunicorn
      # + Uvicorn workers, min 2 even on a small SBC) forks a second full
      # copy of the app right at startup -- exactly when memory is most
      # strained. Pinned to 1 worker to halve that peak.
      # PYTHONDONTWRITEBYTECODE only stops Python *writing* new .pyc files;
      # it does nothing about the image's own .pyc files being *read* back
      # corrupted. "bad marshal data" crash loops are caused by the USB
      # root drive returning bad bytes on read, not by memory pressure --
      # see docs/system-panel.md and scripts/storage_watchdog.py, which
      # auto-recovers from them.
      - WEB_CONCURRENCY=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - mealie_data:/app/data
    ports:
      - "9000:9000"
    restart: unless-stopped
    # Soft reservation, not a hard mem_limit -- Mealie is the biggest
    # process here, so capping it would risk OOM-kills. (Its recurring
    # crash loops turned out to be storage read corruption, not memory --
    # see storage_watchdog.py.) This just tells the kernel to
    # reclaim from everything else first when the device gets tight,
    # giving Mealie first claim on what's actually free.
    mem_reservation: 400m
    logging: *default-logging

  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    hostname: home-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - syncthing_data:/var/syncthing
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
    # 1G was a no-op on a device with only ~914Mi total RAM -- it could
    # never actually be hit, so it wasn't protecting anything. Syncthing
    # is the known hog here (large folder indexing/scanning spikes), and
    # it's the one we've manually `docker compose stop`'d before to free
    # memory for Mealie -- 350m makes that headroom permanent instead of
    # something that has to be done by hand during a crash.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 350M
    logging: *default-logging

volumes:
  pihole_etc:
  pihole_dnsmasq:
  kanboard_data:
  mealie_data:
  syncthing_data:
