services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      - TZ=${TIMEZONE}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - FTLCONF_interface=eth0
      - FTLCONF_dns_listeningMode=ALL
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
      - ./dnsmasq-custom.conf:/etc/dnsmasq.d/05-custom.conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    restart: unless-stopped

  kanboard:
    image: kanboard/kanboard:latest
    container_name: kanboard
    volumes:
      - kanboard_data:/var/www/html/data
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TRIGGER_SECRET=${TRIGGER_SECRET}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      - pihole
      - mealie
      - kanboard
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.19.2
    container_name: mealie
    environment:
      - TZ=${TIMEZONE}
      - DB_ENGINE=sqlite
      - BASE_URL=http://${HOST_IP}:9000
    volumes:
      - mealie_data:/app/data
    ports:
      - "9000:9000"
    restart: unless-stopped

  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: home-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TIMEZONE}
    volumes:
      - syncthing_data:/var/syncthing
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped

volumes:
  pihole_etc:
  pihole_dnsmasq:
  kanboard_data:
  mealie_data:
  syncthing_data:
